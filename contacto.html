<!DOCTYPE html>
<html lang="es">
    <head meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Atzin M">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<title>Contacto</title>
</head>
<body>
    <header class="Intro">
        <img src="LogoFBI.png" alt="Logo del FBI" class="Logo">
        <h1 >¿HAS TENIDO UNA EXPERIENCIA PARANORMAL O 
     UN AVISTAMIENTO OVNI?</h1>
    </header>
    <main>
        <div class="Parte1">
            <p>Comparte tu historia, fotografías o evidencia. Tu testimonio puede ayudar a documentar fenómenos que aún no 
             tienen explicación.</p>
        </div>
        <form>
       <textarea name="Historia" id="Historia" placeholder="Cuéntanos tu historia"></textarea>
       <div class="Parte2">
        <p> Ayúdanos a documentar lo inexplicable. Adjunta tu evidencia del suceso.</p>
       </div>
       <div class="Recuadro">
       <input type="file" id="Imagen" name="Imagen" multiple>
       </div>
       <button type="submit" class="Boton"> ENVIAR </button>
        </form>
       </form>
    </main>
</body>
</html>
